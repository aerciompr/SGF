version: '3.8'

services:
  app:
    build: .
    container_name: sgf-jfal
    ports:
      - "3030:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-sgf_jfal_secret_2024}
      - ADMIN_PASS=${ADMIN_PASS:-admin123}
      - RECEP_PASS=${RECEP_PASS:-recepcao123}
      - PERITO_PASS=${PERITO_PASS:-perito123}
      - CONCIL_PASS=${CONCIL_PASS:-conciliador123}
    volumes:
      - sgf_data:/app/backend/data
    restart: unless-stopped

volumes:
  sgf_data:
