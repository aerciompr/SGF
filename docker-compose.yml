version: '3.8'

services:
  app:
    build: .
    container_name: sgf-jfal
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-mude_esta_senha_em_producao}
    volumes:
      - sgf_data:/app/backend/data
    restart: unless-stopped

volumes:
  sgf_data:
