<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGF — Chamada Avulsa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a1628;
      --surface:   #0f1e38;
      --border:    rgba(33,150,212,0.18);
      --primary:   #2196d3;
      --primary-h: #1a7ab5;
      --success:   #10b981;
      --warning:   #f59e0b;
      --danger:    #ef4444;
      --text:      #e8f4f8;
      --muted:     #8ba5be;
      --radius:    14px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0d1f3c 60%, #0a1628 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(15,30,54,0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo { display: flex; align-items: center; gap: 14px; }
    .logo img { height: 40px; width: auto; }
    .logo-text h1 { font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .logo-text span { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .back-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: .875rem;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: all .2s;
    }
    .back-btn:hover { background: rgba(33,150,212,.1); color: var(--text); border-color: var(--primary); }

    /* ── Main ── */
    main {
      width: 100%;
      max-width: 640px;
      padding: 48px 24px;
      flex: 1;
    }

    .page-title {
      text-align: center;
      margin-bottom: 40px;
    }
    .page-title .icon-wrap {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary), #1557a0);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 0 40px rgba(33,150,212,.35);
    }
    .page-title h2 {
      font-size: 1.9rem; font-weight: 800;
      letter-spacing: -.03em;
      background: linear-gradient(90deg, #fff, #7ec8f4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .page-title p { color: var(--muted); margin-top: 8px; font-size: .95rem; }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,.4);
    }

    /* ── Form ── */
    .form-group { margin-bottom: 22px; }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: rgba(10,22,40,.7);
      color: var(--text);
      font-size: 1.05rem;
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(33,150,212,.2);
    }
    input[type="text"]::placeholder { color: rgba(139,165,190,.5); }

    /* ── Tipo segmented control ── */
    .tipo-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .tipo-btn {
      padding: 11px 8px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: rgba(10,22,40,.7);
      color: var(--muted);
      font-size: .78rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      transition: all .2s;
      line-height: 1.3;
    }
    .tipo-btn:hover { border-color: var(--primary); color: var(--text); }
    .tipo-btn.active {
      border-color: var(--primary);
      background: rgba(33,150,212,.15);
      color: var(--primary);
      box-shadow: 0 0 0 3px rgba(33,150,212,.1);
    }

    /* ── Salas sugestão ── */
    .sala-sugestoes {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 8px;
    }
    .sala-chip {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: .78rem;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
    }
    .sala-chip:hover, .sala-chip.active {
      border-color: var(--primary);
      background: rgba(33,150,212,.12);
      color: var(--primary);
    }

    /* ── Botão chamar ── */
    .btn-chamar {
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--primary), #1557a0);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: .02em;
      transition: all .25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(33,150,212,.35);
      margin-top: 8px;
    }
    .btn-chamar:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(33,150,212,.5);
    }
    .btn-chamar:active:not(:disabled) { transform: translateY(0); }
    .btn-chamar:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── Feedback ── */
    .feedback {
      display: none;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      border-radius: 12px;
      margin-top: 20px;
      font-weight: 600;
      font-size: .95rem;
      animation: slideUp .3s cubic-bezier(.34,1.56,.64,1);
    }
    .feedback.success { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3); color: #34d399; }
    .feedback.error   { background: rgba(239,68,68,.12);  border: 1px solid rgba(239,68,68,.3);  color: #f87171; }
    .feedback.visible { display: flex; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Histórico recente ── */
    .historico-title {
      font-size: .75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin: 32px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .historico-list { display: flex; flex-direction: column; gap: 8px; }
    .hist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(10,22,40,.5);
      border: 1px solid var(--border);
      font-size: .875rem;
    }
    .hist-nome { font-weight: 600; color: var(--text); }
    .hist-sala { color: var(--muted); font-size: .8rem; }
    .hist-time { color: rgba(139,165,190,.6); font-size: .75rem; font-variant-numeric: tabular-nums; }
    .hist-empty { color: var(--muted); font-size: .85rem; text-align: center; padding: 16px; }

    /* ── Loading spinner ── */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    .btn-chamar.loading .spinner { display: block; }
    .btn-chamar.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="logo-jfal.png" alt="JFAL">
      <div class="logo-text">
        <h1>SGF</h1>
        <span>Chamada Avulsa</span>
      </div>
    </div>
    <a href="/" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Voltar
    </a>
  </header>

  <main>
    <div class="page-title">
      <div class="icon-wrap">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
      </div>
      <h2>Chamada Avulsa</h2>
      <p>Digite o nome e a sala — o painel de TV exibirá a chamada imediatamente</p>
    </div>

    <div class="card">
      <form id="form-chamar" autocomplete="off">

        <!-- Nome -->
        <div class="form-group">
          <label for="input-nome">Nome da pessoa</label>
          <input
            id="input-nome"
            type="text"
            placeholder="Ex: João da Silva"
            maxlength="120"
            required
            autofocus
          >
        </div>

        <!-- Tipo -->
        <div class="form-group">
          <label>Tipo de chamada</label>
          <div class="tipo-group">
            <button type="button" class="tipo-btn active" data-tipo="pericia">⚕️ Perícia</button>
            <button type="button" class="tipo-btn" data-tipo="audiencia_parte">⚖️ Audiência<br>Parte</button>
            <button type="button" class="tipo-btn" data-tipo="audiencia_testemunha">🗣️ Audiência<br>Testemunha</button>
          </div>
        </div>

        <!-- Sala -->
        <div class="form-group">
          <label for="input-sala">Sala / Local</label>
          <input
            id="input-sala"
            type="text"
            placeholder="Ex: Sala de Perícia 1"
            maxlength="100"
            required
          >
          <div class="sala-sugestoes" id="sala-sugestoes">
            <!-- Preenchido via JS com salas cadastradas -->
          </div>
        </div>

        <!-- Botão -->
        <button type="submit" class="btn-chamar" id="btn-chamar">
          <span class="spinner"></span>
          <span class="btn-text" style="display:flex;align-items:center;gap:12px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
            Chamar no Painel
          </span>
        </button>

        <!-- Feedback -->
        <div class="feedback" id="feedback"></div>
      </form>
    </div>

    <!-- Histórico recente -->
    <div class="historico-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Chamadas de hoje
    </div>
    <div class="historico-list" id="historico-list">
      <div class="hist-empty">Carregando...</div>
    </div>
  </main>

  <script>
  (function() {
    const API = window.location.origin + '/api';
    let tipoSelecionado = 'pericia';

    // ── Tipo buttons ──
    document.querySelectorAll('.tipo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        tipoSelecionado = btn.dataset.tipo;
      });
    });

    // ── Carregar salas cadastradas como sugestão ──
    async function loadSalas() {
      try {
        const r = await fetch(API + '/salas?t=' + Date.now());
        if (!r.ok) return;
        const salas = await r.json();
        const wrap = document.getElementById('sala-sugestoes');
        wrap.innerHTML = '';
        salas.filter(s => s.ativo).forEach(s => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'sala-chip';
          chip.textContent = s.nome;
          chip.addEventListener('click', () => {
            document.getElementById('input-sala').value = s.nome;
            document.querySelectorAll('.sala-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
          });
          wrap.appendChild(chip);
        });
      } catch(e) { /* salas não obrigatórias */ }
    }

    // ── Carregar histórico ──
    async function loadHistorico() {
      try {
        const r = await fetch(API + '/public/historico?t=' + Date.now());
        const lista = await r.json();
        const el = document.getElementById('historico-list');
        if (!lista.length) {
          el.innerHTML = '<div class="hist-empty">Nenhuma chamada hoje ainda</div>';
          return;
        }
        el.innerHTML = lista.slice(0, 10).map(h => `
          <div class="hist-item">
            <div>
              <div class="hist-nome">${esc(h.nome)}</div>
              <div class="hist-sala">→ ${esc(h.sala)}</div>
            </div>
            <div class="hist-time">${fmtTime(h.chamado_at)}</div>
          </div>
        `).join('');
      } catch(e) {}
    }

    // ── Enviar chamada ──
    document.getElementById('form-chamar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('input-nome').value.trim();
      const sala = document.getElementById('input-sala').value.trim();
      if (!nome || !sala) return;

      const btn = document.getElementById('btn-chamar');
      const feedback = document.getElementById('feedback');
      btn.disabled = true;
      btn.classList.add('loading');
      feedback.className = 'feedback';
      feedback.textContent = '';

      try {
        const r = await fetch(API + '/public/chamar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, sala, tipo: tipoSelecionado })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Erro ao chamar');

        feedback.className = 'feedback success visible';
        feedback.innerHTML = `
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          <span><strong>${esc(nome)}</strong> chamado(a) para <strong>${esc(sala)}</strong>!</span>
        `;

        // Limpa nome, mantém sala e tipo para facilitar chamadas sequenciais
        document.getElementById('input-nome').value = '';
        document.getElementById('input-nome').focus();

        // Atualiza histórico
        setTimeout(loadHistorico, 500);

        // Esconde feedback após 4s
        setTimeout(() => { feedback.className = 'feedback'; }, 4000);
      } catch(err) {
        feedback.className = 'feedback error visible';
        feedback.innerHTML = `
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          <span>${esc(err.message)}</span>
        `;
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    });

    // ── Utils ──
    function esc(t) {
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(t || ''));
      return d.innerHTML;
    }
    function fmtTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      if (isNaN(d)) return ts;
      return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    // ── Init ──
    loadSalas();
    loadHistorico();
    setInterval(loadHistorico, 10000);
  })();
  </script>
</body>
</html>
