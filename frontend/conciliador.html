<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SGF-JFAL - Tela do Conciliador">
  <title>SGF-JFAL - Conciliador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="module-page">

  <header class="header" id="app-header" hidden>
    <div class="header-left">
      <div class="logo">
        <img src="logo-jfal.png" alt="JFAL" class="logo-img">
        <div class="logo-text">
          <h1>SGF - Conciliador</h1>
          <span class="logo-subtitle">Audiências, Partes e Testemunhas</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <span id="user-label" style="font-size:0.78rem;color:var(--text-muted);"></span>
      <button class="btn btn-outline btn-sm" id="btn-logout" title="Sair">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </button>
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Menu
      </a>
      <button class="btn btn-outline btn-sm" id="btn-open-display">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Display TV
      </button>
      <div class="clock" id="page-clock"></div>
    </div>
  </header>

  <!-- Login Screen -->
  <div class="login-overlay" id="login-overlay">
    <div class="login-card">
      <div class="login-logo">
        <img src="logo-jfal.png" alt="JFAL" style="height:60px;">
      </div>
      <h2>SGF - Conciliador</h2>
      <p style="color:var(--text-muted);margin-bottom:24px;font-size:0.85rem;">Acesso restrito. Informe suas credenciais.</p>
      <form id="form-login" autocomplete="off">
        <div class="form-group">
          <label for="login-usuario">Usuário</label>
          <input type="text" id="login-usuario" placeholder="Usuário" required autofocus>
        </div>
        <div class="form-group">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" placeholder="Senha" required>
        </div>
        <div id="login-error" style="color:var(--danger-400);font-size:0.8rem;margin-bottom:12px;display:none;"></div>
        <button type="submit" class="btn btn-primary btn-full">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Entrar
        </button>
      </form>
      <a href="index.html" style="display:inline-block;margin-top:16px;color:var(--text-muted);font-size:0.8rem;text-decoration:none;">← Voltar ao Menu</a>
    </div>
  </div>

  <main class="module-main two-col" id="app-main" style="max-width:1400px;" hidden>
    <!-- Left: Nova Pauta -->
    <div style="display:flex;flex-direction:column;gap:24px;">
      <section class="card">
        <div class="card-header">
          <h2>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nova Pauta de Audiência
          </h2>
        </div>
        <div class="card-body">
          <form id="form-nova-pauta" autocomplete="off">
            <div class="form-group">
              <label for="input-processo">Número do Processo</label>
              <input type="text" id="input-processo" placeholder="0000000-00.0000.0.00.0000" required>
            </div>
            <div class="form-group">
              <label for="select-sala-audiencia">Sala de Audiência</label>
              <select id="select-sala-audiencia" required>
                <option value="">-- Selecionar --</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary btn-full">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Criar Pauta
            </button>
          </form>
        </div>
      </section>

      <!-- Histórico de chamadas do conciliador -->
      <section class="card">
        <div class="card-header">
          <h2>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Histórico de Chamadas
          </h2>
        </div>
        <div class="card-body scroll" id="historico-audiencias" style="max-height:300px;">
        </div>
      </section>
    </div>

    <!-- Right: Pautas do dia -->
    <div>
      <section class="card">
        <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
          <h2 style="margin:0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Pautas do Dia
            <span class="queue-count" id="pautas-count">0</span>
          </h2>
          <div class="search-box" style="flex: 1; max-width: 300px; position: relative;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="input-busca-pautas" placeholder="Buscar processo ou nome..." style="width: 100%; padding-left: 36px; padding-right: 12px; height: 36px; border-radius: var(--radius-sm); border: 1px solid var(--bg-card-border); background: var(--bg-input); color: var(--text-primary); outline: none; transition: border-color 0.2s;">
          </div>
        </div>
        <div class="card-body scroll" id="lista-pautas" style="max-height:calc(100vh - 200px);">
        </div>
      </section>
    </div>
  </main>

  <!-- Modal: Adicionar Parte -->
  <div class="modal-overlay" id="modal-add-parte">
    <div class="modal">
      <div class="modal-header">
        <h3>Adicionar Parte</h3>
        <button type="button" class="btn-icon" id="btn-close-parte">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="form-add-parte">
        <div class="modal-body">
          <div class="form-group">
            <label for="input-parte-nome">Nome da Parte</label>
            <input type="text" id="input-parte-nome" placeholder="Nome completo" required>
          </div>
          <div class="form-group">
            <label for="select-parte-tipo">Tipo</label>
            <select id="select-parte-tipo">
              <option value="autor">Autor</option>
              <option value="reu">Réu</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline btn-sm" id="btn-cancel-parte">Cancelar</button>
          <button type="submit" class="btn btn-primary btn-sm">Adicionar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Adicionar Testemunha -->
  <div class="modal-overlay" id="modal-add-testemunha">
    <div class="modal">
      <div class="modal-header">
        <h3>Adicionar Testemunha</h3>
        <button type="button" class="btn-icon" id="btn-close-testemunha">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="form-add-testemunha">
        <div class="modal-body">
          <div class="form-group">
            <label for="input-testemunha-nome">Nome da Testemunha</label>
            <input type="text" id="input-testemunha-nome" placeholder="Nome completo" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline btn-sm" id="btn-cancel-testemunha">Cancelar</button>
          <button type="submit" class="btn btn-primary btn-sm">Adicionar</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer" id="app-footer" hidden>
    <img src="logo-jfal.png" alt="JFAL" class="footer-logo">
    <span>Desenvolvido por Justiça Federal em Alagoas - DTI</span>
  </footer>

  <div class="toast-container" id="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="shared.js"></script>
  <script src="conciliador.js"></script>
</body>
</html>
